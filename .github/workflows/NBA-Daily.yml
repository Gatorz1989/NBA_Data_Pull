name: NBA daily - pull data, grade, refit, log

on:
  schedule:
   # 12:00 UTC = 7:00 am Eastern (standard time, Nov 1 to March 2027)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore private state (today's pending picks and closing lines)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: nba-state-${{ github.run_id }}
          restore-keys: nba-state-

      - name: Pull data (ESPN + The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python nba_edge_data_pull.py

      - name: Grade finished games, refit calibration, write summary, log today's picks privately
        run: node nba_auto.js daily

      - name: Commit data and results
        run: |
          git config user.name  "nba-edge-bot"
          git config user.email "nba-edge-bot@users.noreply.github.com"
          for f in nba_model_data.json nba_calibration.json nba_calibration_log.json nba_summary.json results; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "NBA daily $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Save private state
        uses: actions/cache/save@v4
        with:
          path: state
          key: nba-state-${{ github.run_id }}
